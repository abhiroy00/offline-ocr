# Local development stack: CPU OCR, hot-reloading backend + frontend.
# For the EC2 GPU deployment, see docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ocr
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-only-insecure-secret-key
      DATABASE_URL: postgres://ocr:ocr@postgres:5432/ocr
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      OCR_DEVICE: cpu
    depends_on:
      - postgres
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SECRET_KEY: dev-only-insecure-secret-key
      DATABASE_URL: postgres://ocr:ocr@postgres:5432/ocr
      REDIS_URL: redis://redis:6379/0
      OCR_DEVICE: cpu
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
