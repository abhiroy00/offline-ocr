name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        # Deliberately CPU-OCR-free here: paddleocr/paddlepaddle add several
        # minutes + ~500MB to every CI run for tests that don't need real
        # OCR inference. Tests tagged `requires_paddleocr` auto-skip when
        # the package isn't importable (see ocr/tests/conftest.py) -- they
        # run locally and are exercised before every release instead.
        run: pip install -r requirements/base.txt -r requirements/dev.txt

      - name: Lint
        run: flake8 ocr config

      - name: Django check
        run: python manage.py check

      - name: Run tests
        run: pytest --cov=ocr --cov-report=term-missing -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image (CPU)
        run: docker build -t offline-ocr-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t offline-ocr-frontend:ci ./frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets are configured
        id: secret_check
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ] || [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no deploy secrets configured yet)
        if: steps.secret_check.outputs.configured == 'false'
        run: |
          echo "::notice::Deploy skipped -- add EC2_HOST, EC2_USER, EC2_SSH_KEY repo secrets to enable auto-deploy."

      - name: Deploy to EC2 over SSH
        if: steps.secret_check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            git pull origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T backend python manage.py collectstatic --noinput
